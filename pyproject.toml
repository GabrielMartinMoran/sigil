[project]
name = "sigil"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.14.2",
    "pydantic-ai>=2.65.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
    "textual>=8.2.8",
]


[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-sugar>=1.1.1",
    "ruff>=0.17.3",
]


[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
