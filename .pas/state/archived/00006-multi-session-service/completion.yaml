implementation:
  - Canonical registry with one Composition and consumer per resident session; shared database, credentials, process lock and queue recovery.
  - Independent active model selection over shared future-conversation preferences.
  - Serialized off-loop creation and open; cancellation retains registry ownership until construction finishes.
  - Session-owned callbacks and events; session-filtered live SSE and replay with global cursors.
  - Explicit session query/header required for conversation operations; unscoped state bootstrap and body-addressed open are documented exceptions.
  - Response-lifetime leases and configurable session idle release; work, clients and unread reports retain ownership.
  - Shutdown drains all consumers, child cleanup, title tasks, MCP startup and transports, and extensions before process ownership release.
  - TUI and web own selection; switching leaves earlier work running, streams reconnect by session, stale replies are ignored or refused.
  - Architecture documentation, runtime/callback/multi-session specs and rebuilt tracked web bundle.
