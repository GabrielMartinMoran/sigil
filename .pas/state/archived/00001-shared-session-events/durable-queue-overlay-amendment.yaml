execution: Sequential tasks, each followed by independent pas_qa with same skills. Full project checks final tree. Do not start next task after FAIL or BLOCKED without adjudication.
limitations:
  - No TUI migration, shared daemon discovery, complete snapshot/event replay, image picker, native Windows or exactly-once external tool effects.
  - No general guarantee of one unified bubble after arbitrary divergent writes; conflict notice may repeat text in a distinct section as chosen.
  - Older noncooperative processes must be closed; durable power safety depends on filesystem and hardware sync.
  - A checkpoint failure can leave external effects uncertain; never assert that an interrupted input was not processed.
