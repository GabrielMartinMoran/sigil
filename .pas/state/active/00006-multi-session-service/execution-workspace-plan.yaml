version: 1
status: approved
approval_basis: User replied Dale to the workspace-isolation plan, chose the original workspace, then requested continua.
contract: session-scoped-workspace-v1
parent: .pas/state/active/00006-multi-session-service/plan.yaml
implementation_authorized: true
objective: Isolate execution workspace resolution without changing process cwd.
research_gate: Passed for this bounded slice after researcher6762f284 mapping and exact local-turn/callback/skills follow-up.
user_constraints:
  - Background work must remain possible while clients switch sessions; do not introduce a switch prohibition.
  - HTTP events must require a session when the route and clients migrate together in a later slice.
  - Continue feature00006; preserve unrelated work and the committed EventHub046badd foundation.
agent_decisions:
  - Add execution_workspace(root) context manager and a private ContextVar in src/engine/files/paths.py; capture an absolute resolved root on entry and reset token in finally.
  - Extend workspace_root with an optional composition fallback; bound execution root wins, then supplied fallback, then Path.cwd().resolve(). Preserve existing no-argument callers.
  - Keep resolve(path, root=...) and other explicit root parameters authoritative; do not globally reinterpret explicit root as a fallback.
  - Add Composition.execution_root() delegating to workspace_root(self.workspace_manager.root). Route existing AgentSpec permissions, shell, file/conflict and image root callbacks through this method.
  - Bind execution_workspace to a snapshot of the selected workspace around the full agent.iter lifetime on server _turn and standalone local TUI run_turn, including iteration and tool execution; never consult a mutable current session after starting the run.
  - Child asyncio tasks and synchronous tool execution inherit the bound root; prove with real production execution seams and deterministic known-window streamed models, not private scheduler patches.
  - Remove os.chdir from WorkspaceManager.switch while retaining target validation, rebind, persistence, callbacks and existing error handling. Workspace selection becomes component state, never process state.
  - Initialize default Composition skill registry against self.root before first use, respecting existing explicit skill-directory overrides; retain later registry rebind lifecycle.
  - Skill subprocesses keep cwd=metadata.path; MCP/repository/shell child processes retain their intentional explicit cwd values. No sweeping Path.cwd replacements.
  - ScopeTracker and WorkspaceInstructions remain composition-owned explicit-root rebindables; this slice does not claim immutable full prompt/model/tree state across rebinding.
  - No budget policy changes, model guard bypass, report-routing patches, EventHub migration, HTTP/client contract changes or concurrent runtime creation.
  - Apply to subsequent turns and workspace switches after updated code is loaded; no new setting or restart-only preference is introduced. Already running processes are not restarted by this task.
