  - Unexpected ambient cwd dependencies outside inventoried paths must be escalated, not patched outside scope.
  - Initial project skills must preserve explicit SIGIL_SKILLS_DIRS/custom roots rather than override all registries indiscriminately.
  - Experimental validator layout findings may persist; report them, do not claim validator PASS without evidence.
