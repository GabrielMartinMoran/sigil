    tag: '@unit'
    cheapest_sufficient: unit
    rationale: Pure path/context decisions need no app, network or IO fixtures beyond temporary paths.
  - behavior: Concurrent execution contexts, thread and child-task inheritance, tool root callbacks and shell subprocess cwd.
    tag: '@integration'
    cheapest_sufficient: integration
    rationale: Real task/thread/tool/process boundaries cannot be established by resolver mocks.
  - behavior: Server and local TUI execution binding and cancellation cleanup.
    tag: '@integration'
