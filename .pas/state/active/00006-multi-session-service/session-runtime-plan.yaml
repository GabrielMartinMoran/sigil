version: 1
status: approved
contract: session-runtime-extraction-v1
implementation_authorized: true
authorization: User approved the presented extraction plan with 'Avanza hasta terminar toda la feature... me voy a dormir'. Approval covers this exact contract; later changed scopes retain their approval boundary.
objective: Extract one session execution owner while preserving the ServerRuntime facade and current single-session behavior.
research_gate: Passed after researcher5524780c full-field/method inventory and exact constructor, lifecycle and fixture seam follow-up.
user_constraints:
  - Continue feature00006 and preserve all existing user work and accepted workspace/EventHub changes.
  - Background work and switching remain required; no new switching prohibition.
  - Required HTTP session selector and client migration remain later, together.
agent_decisions:
  - Keep src.server.runtime.ServerRuntime import, constructor signature and all existing public methods/properties and composition/hub access stable.
  - Add src/server/session_runtime.py with SessionRuntime owning the composition and all turn, queue consumer, question, checkpoint, wake, steering, retry/tree/tool and MCP/title callback execution state.
  - Keep process ownership and require_ownership gate, start reconciliation, service idle monitor, shared EventHub and store/database references on ServerRuntime.
  - Pass Composition, EventHub, shared AcceptedInputs handle, resolved question timeout and a typed worker-ownership validation callback explicitly into SessionRuntime. SessionRuntime never acquires/releases ServerOwnership or closes Database.
  - Leave Composition construction of store/config/catalog intact in this mechanical stage; the service retains shared-resource references, not a new parallel database connection or engine dependency-injection redesign.
  - ServerRuntime owns one SessionRuntime for now, exposed by an explicit read-only session_runtime property. Do not introduce concurrent consumers or a multi-session registry until the following concurrency contract.
  - Implement explicit typed facade methods/properties with the existing signatures; no broad __getattr__, __setattr__, dynamic proxy registry or inheritance pretending separate state owners.
  - SessionRuntime.ensure_workers invokes the supplied ownership guard before starting its consumer or MCP loader, preserving the guard even for internal send paths.
  - ServerRuntime.start acquires/adopts the existing process lock and reconciles accepted rows exactly once. Service-wide has_active_work still checks busy plus nonterminal rows in any session, and stop_when_idle uses the facade method so instance monkeypatches remain effective.
  - SessionRuntime.close resolves its question, marks session closing, cancels consumer and detaches existing question/tool sinks and composition cleanup; it does not release the service lock or close cached DB. ServerRuntime.close performs session cleanup and releases ownership in a finally, preserving idempotency and graceful queue semantics.
  - Move shared constants, PendingQuestion, IncomingImage, decode_images, resolve_question_timeout and related existing value/helpers unchanged into src/server/runtime_support.py. Keep IdleShutdown on the service boundary. Import dependencies remain acyclic; re-export existing runtime module imports explicitly as a compatibility API.
  - Preserve all public facade methods listed below. Session-changing methods still rebind the sole composition in this intermediate refactor; do not claim the observed stranded-report issue is fixed yet.
  - Mechanically adapt only test accesses to private execution state through runtime.session_runtime; keep assertions and scenarios unchanged. Public lock/idle checks remain facade-based.
  - Move the existing slow-turn monkeypatch to the actual implementation module and the unbound tool-event test to SessionRuntime._on_tool_event with its same fake and assertions; do not leave patches ineffective.
  - Preserve callback semantics, event payloads/order, model-window guard, accepted queue transitions, steering, question deadlines and cancel behavior. No new producer ownership tagging in this refactor.
