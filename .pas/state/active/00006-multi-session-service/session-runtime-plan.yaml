  properties: [session, busy, pending_question, composition, hub, session_runtime]
  methods: [has_active_work, stop_when_idle, start, ensure_workers, send, abort, stop_all, wait, answer, node, stop_node, background_node, set_external_files, toggle_mcp, set_model, set_effort, select_agent, rollback_points, rollback, fork, create_worktree, refuse_while_busy, adopt_model, model_defaults, save_model_default, switch_workspace, new_session, open_session, close]
