  worker: pas_developer
  verifier: pas_qa
  objective: Perform the one-session extraction, compatibility fixture adjustments and scoped architecture note as one behavior-preserving change.
  paths:
    - src/server/runtime.py
    - src/server/session_runtime.py
    - src/server/runtime_support.py
    - tests/test_server_session_runtime.py
    - tests/test_server_runtime.py
