  - Shared cached DB must not acquire session-owned close behavior; no second process lock acquisition.
  - Explicit facade is verbose but makes ownership inspectable; do not compress it into dynamic magic.
  - Fixture references legitimately change where private state lives; behavior assertions and rejection/deadline tests must remain intact.
  - This extraction intentionally retains the single-session facade and rebinding behavior; report-routing and concurrent-session behavior are not delivered here.
  - The single shared Mind checkpoint was updated by an unrelated core-performance task; use local PAS state and feature-specific memory records, do not overwrite that task's checkpoint.
