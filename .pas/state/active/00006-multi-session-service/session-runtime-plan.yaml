    - src/server/cli.py
    - src/server/views.py
    - src/engine/bootstrap.py
    - tests/test_server_idle.py
    - tests/test_server_launch.py
  acceptance_tags: ['@integration', '@contract']
  red:
    - Add tests proving the facade owns one distinct SessionRuntime and delegates composition/session/turn/question behavior to it, while process ownership remains on the service.
    - Add lifecycle regression showing session cleanup cannot release the service lock or close the shared cached database, and facade close releases ownership idempotently without interrupting never-executed rows.
    - Establish public import and signature compatibility through existing callers plus focused contract assertions; fail for missing SessionRuntime before implementation.
  green:
    - Move existing execution methods and state with minimal semantic edits; wire callbacks to the session runtime rather than leaving them bound to the facade.
    - Keep old helpers/types importable from runtime.py while actual implementations use runtime_support.py directly, never importing facade back from session_runtime.
    - Adjust private-state fixture references and the two module/class patch seams only; preserve all behavioral assertions, tests and event bytes.
    - Add a concise current-runtime ownership note with source references in docs/architecture.md without rewriting accepted historical proposals, other sections or headings.
  refactor:
    - Remove only now-unused imports from touched modules, keep explicit typed facade delegation, avoid moving unrelated engine code or test assertions.
    - Preserve the accepted execution_workspace binding in the extracted turn loop and all existing callback registration/cleanup semantics.
  focused: uv run pytest -q -p no:sugar tests/test_server_session_runtime.py tests/test_server_runtime.py tests/test_server_queue.py tests/test_server_idle.py tests/test_tool_outputs.py
  integration_regression: uv run pytest -q -p no:sugar tests/test_server_parity.py tests/test_ui_client.py tests/test_ui_service_client.py tests/test_server_launch.py
  full_checks:
    - uv run pytest -q -p no:sugar -n 8
    - uv run ruff check src tests
    - uv run ruff format --check src tests
    - git diff --check
  docs_checks: Source/content consistency, relative link targets, preserved headings and scope.
  validator: Run experimental clean-python pilot if available and report non-passing findings, no out-of-scope layout fixes.
  escalation: Stop before any other path, changed public behavior, new concurrency/routing/state policy, unrelated baseline failure or need to modify app/CLI/bootstrap construction. Return converging progress at soft50steps; do not rush full verification.
verification_levels:
  - behavior: Facade delegates to a distinct session owner while stable public imports and signatures remain usable.
    tag: '@contract'
    cheapest_sufficient: contract
    rationale: Direct API/type/signature assertions establish this compatibility boundary without mounting a UI.
  - behavior: One session retains queue, turn, steering, retry, wake, question and workspace semantics after extraction.
    tag: '@integration'
    cheapest_sufficient: integration
    rationale: Existing real runtime and client tests are the oracle; isolated delegates cannot establish callback wiring.
  - behavior: Session cleanup does not close process-owned resources and facade cleanup releases the lock safely.
    tag: '@integration'
    cheapest_sufficient: integration
    rationale: Real temporary DB/ownership lock and lifecycle are the contract, not mocks of resource closure.
  - behavior: Ownership documentation describes current code without claiming concurrent sessions.
    tag: '@contract'
    cheapest_sufficient: contract
    rationale: Scoped source and link review is sufficient for prose.
